[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"
[project]
name = "quest_automations"
authors = [{name="Quest Media Hub",email="joseph@questmediahub.com"}]
description = "API-first visual automations for ERPNext"
requires-python = ">=3.14"
readme = "README.md"
license = {text="MIT"}
dynamic = ["version"]
dependencies = ["quickjs-ng==0.16.2.1"]
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
